<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Project | SKU Generator</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>

    <style>
        body{
            background-color: rgb(146, 120, 125);
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        .container{ 
            border-radius: 10px;
            background-color: white;
            margin-top: 20px;
            margin-bottom: 20px;
            width: 700px;
            box-shadow: 5px 5px 15px 5px rgba(0,0,0,0.52);
            padding: 20px;
        }


        .nav-link{
            color: rgb(214, 116, 177);
            font-weight: bold;
        }

        #header1{
            background-color: pink;
            padding: 10px;
            border-radius: 10px;
        }

        h1{  
            color: rgb(184, 111, 123);
            border-radius: 10px;
            height: 50px;
            width: auto;
            margin: auto;
            text-align: center;
            font-weight: bold;
        }

        label{
            font-weight: bold;
        }

        .form-control{
            box-shadow: 5px 3px 15px 11px rgba(0, 0, 0, 0.24);
            border-color: rgba(0, 0, 0, 0.385);
        }

        #btn{
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            background-color: rgb(245, 146, 162);
            color: white;
            font-weight: bold;
        }

        p{
            font-weight: bold;
            color: rgb(75, 74, 74);
        }

        .footer{
			padding-top: 10px;
			height: 40px;
			right: 0;
			bottom: 0;
			width: 100%;
			background-color: pink;
			color: rgb(214, 116, 177);;
			text-align: center;
            position: fixed;
		}
        #hdrtext{
            text-align: center;
            color: rgb(142, 68, 81);
            font-size: large;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg" style="background-color: pink;">
        <div class="container-fluid">
            <div class="collapse navbar-collapse" id="mynavbar">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link">Benitez & Godino</a>
                    </li>
                </ul>

                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Receipt Generator</a>
                    </li>
                    
                    <li class="nav-item">
                        <a class="nav-link" href="sku.html">SKU Generator</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div id="header1">
            <h1>SKU Generator</h1>
            <p id="hdrtext">Benitez & Godino - Coffee Shop 🍵</p>
        </div>
            
        <br>

        <label for="options">🏷️ Category</label>
            <br>
            <select id="category" class="form-control">
                <option>Choose a Category</option>
                <option>Beverages</option>
                <option>Pastries</option>
                <option>Perishable</option>
            </select>   

        <br><br>

        <label for="word">📦 Product Name</label>
            <br>
            <input type="text" id="product" name="product" placeholder="e.g. Bottled Water"  class="form-control" required>
        
        <br><br>

        <label for="word">🏭 Stock Quantity</label>
            <br>
            <input type="number" id="stock" name="stock" placeholder="e.g. 50"  class="form-control" required>
        
        <br><br>

        <button type="button" py-click="display_char" id="btn" class="form-control">Generate SKU</button>
            
        <hr>

        <div id="output1">
            <p>Your generated SKU will appear here:</p>
            <script type="py" src="sku.py"></script>
        </div>
    </div>

    <div class="footer">
		<b>SKU Generator - 1st Quarter Project</b>
	</div>
</body>
</html>
